<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دانلود CozyShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D2B48C;
            font-family: 'Quicksand', sans-serif;
            padding: 1rem;
        }
        .card {
            background: rgba(255, 245, 235, 0.5);
            backdrop-filter: blur(4px);
            padding: 3rem 2.5rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: transform 0.25s ease;
        }
        .card:hover {
            transform: scale(1.01);
        }
        .download-btn {
            display: inline-block;
            background-color: #5D3A1A;
            color: #fff6ea;
            font-size: 1.6rem;
            font-weight: 600;
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            text-decoration: none;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 0 #3f2812, 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }
        .download-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #3f2812, 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        .download-btn:hover {
            background-color: #6e4622;
            box-shadow: 0 8px 0 #4a311a, 0 12px 24px rgba(0, 0, 0, 0.25);
        }
        .description {
            margin-top: 2.2rem;
            font-size: 1.3rem;
            font-weight: 400;
            color: #2e1e0e;
            line-height: 1.6;
            letter-spacing: 0.3px;
            word-spacing: 1px;
            background: rgba(255, 235, 215, 0.3);
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            font-family: 'Quicksand', sans-serif;
        }
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .download-btn {
                font-size: 1.3rem;
                padding: 0.7rem 2rem;
            }
            .description {
                font-size: 1.1rem;
                padding: 0.6rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="#" class="download-btn" id="downloadLink">
            📘 Get CozyShelf
        </a>
        <p class="description">
            ✦ A personal digital library made for reading PDF files ✦
        </p>
    </div>

    <script>
        document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();
            // لینک مستقیم دانلود از گوگل درایو
            const apkUrl = 'https://drive.google.com/uc?export=download&id=1eQMqB2uCqHaxQu_8XU2WB7o7g9orIVVL';
            
            // روش ۱: دانلود مستقیم (ممکنه برای بعضی مرورگرها کار نکنه)
            // const link = document.createElement('a');
            // link.href = apkUrl;
            // link.download = 'Cozyshelf.apk';
            // document.body.appendChild(link);
            // link.click();
            // document.body.removeChild(link);
            
            // روش ۲: باز کردن در تب جدید (امن‌تر و مطمئن‌تر)
            window.open(apkUrl, '_blank');
        });
    </script>
</body>
</html>
