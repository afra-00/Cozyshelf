<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cozyshelf</title>
  <style>
    /* ... (همون استایل‌های قبلی) ... */
  </style>
</head>
<body>
<!-- ... (همون HTML قبلی) ... -->

<script>
// ====== IndexedDB ======
const DB_NAME = 'CozyshelfDB';
const STORE_NAME = 'books';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onsuccess = (event) => {
      db = event.target.result;
      resolve(db);
    };
    request.onerror = (event) => reject(event.target.error);
  });
}

function getAllBooks() {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not open'); return; }
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function saveBook(book) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not open'); return; }
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const request = store.put(book);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

function deleteBook(id) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not open'); return; }
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const request = store.delete(id);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

// ====== State ======
let books = [];
let currentPage = {};
let pendingBookId = null;
let coverInputTarget = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 4000);
}

function renderBooks() {
  const list = document.getElementById('booksList');
  if (books.length === 0) {
    list.innerHTML = '<p class="empty">📚 No books yet :(</p>';
    return;
  }
  list.innerHTML = books.map(book => {
    const coverHtml = book.coverData 
      ? `<img src="${book.coverData}" alt="cover" />` 
      : '📖';
    return `
    <div class="book-card" data-id="${book.id}">
      <div class="book-cover">${coverHtml}</div>
      <div class="book-details">
        <div class="book-info">
          <h3>${book.name}</h3>
          <div class="meta">Page ${currentPage[book.id] || 0} of ${book.totalPages}</div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${getProgress(book.id)}%"></div></div>
          <div class="meta">${getProgress(book.id)}% completed</div>
        </div>
        <div class="page-control">
          <input type="number" id="page_${book.id}" value="${currentPage[book.id] || 0}" min="0" max="${book.totalPages}" />
          <span>Page</span>
          <button class="done-btn" onclick="updatePage('${book.id}')">Done</button>
        </div>
        <div class="book-actions">
          <button class="read-btn" onclick="openPDF('${book.id}')">📖 Read</button>
          <button class="edit-btn" onclick="toggleEdit('${book.id}')">✏️ Edit</button>
          <button class="cover-btn" onclick="changeCover('${book.id}')">🖼️ Cover</button>
          <button class="remove-btn" onclick="removeBook('${book.id}')">🗑️ Remove</button>
        </div>
        <div class="edit-input" id="edit_${book.id}">
          <input type="text" id="edit_input_${book.id}" value="${book.name}" />
          <button class="save-edit" onclick="saveEditName('${book.id}')">Save</button>
          <button class="cancel-edit" onclick="toggleEdit('${book.id}')">Cancel</button>
        </div>
      </div>
    </div>
  `}).join('');
}

function getProgress(bookId) {
  const total = books.find(b => b.id === bookId)?.totalPages || 1;
  const current = currentPage[bookId] || 0;
  return Math.min(100, Math.round((current / total) * 100));
}

function updatePage(bookId) {
  const input = document.getElementById(`page_${bookId}`);
  const page = Number(input.value);
  const total = books.find(b => b.id === bookId)?.totalPages || 1;
  if (!isNaN(page) && page >= 0 && page <= total) {
    currentPage[bookId] = page;
    localStorage.setItem('cozyshelf_pages', JSON.stringify(currentPage));
    renderBooks();
    showToast('✅ Page updated!');
  } else {
    alert(`Please enter a number between 0 and ${total}`);
  }
}

// ====== Change Cover ======
function changeCover(bookId) {
  coverInputTarget = bookId;
  document.getElementById('coverInput').click();
}

// ====== Open PDF ======
function openPDF(bookId) {
  const book = books.find(b => b.id === bookId);
  if (!book) { alert('کتاب پیدا نشد!'); return; }
  if (!book.fileData) {
    const userConfirm = confirm('📚 فایل PDF در حافظه نیست. می‌خوای الان دوباره آپلودش کنی؟');
    if (userConfirm) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.pdf';
      input.onchange = async function(e) {
        const file = e.target.files[0];
        if (file && file.type === 'application/pdf') {
          const reader = new FileReader();
          reader.onload = async function(event) {
            book.fileData = event.target.result;
            await saveBook(book);
            renderBooks();
            alert('✅ فایل دوباره آپلود شد!');
            openPDF(bookId);
          };
          reader.readAsDataURL(file);
        } else {
          alert('❌ لطفاً یک فایل PDF معتبر انتخاب کن.');
        }
      };
      input.click();
    }
    return;
  }

  pendingBookId = bookId;
  document.getElementById('appSelectorModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function handleAppSelection(appType) {
  const modal = document.getElementById('appSelectorModal');
  modal.classList.remove('active');
  document.body.style.overflow = 'auto';

  if (!pendingBookId) return;
  const book = books.find(b => b.id === pendingBookId);
  if (!book || !book.fileData) {
    alert('خطا: فایل پیدا نشد.');
    return;
  }

  const bookId = pendingBookId;
  pendingBookId = null;

  try {
    const byteString = atob(book.fileData.split(',')[1]);
    const mimeString = book.fileData.split(',')[0].split(':')[1].split(';')[0];
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    const blob = new Blob([ab], { type: mimeString });
    const url = URL.createObjectURL(blob);

    switch(appType) {
      case 'browser':
        const win = window.open('', '_blank');
        if (win) {
          win.document.write(`
            <html><head><title>${book.name}</title>
            <style>body{margin:0;padding:0;}iframe{width:100%;height:100%;border:none;}</style>
            </head>
            <body>
              <iframe src="${url}"></iframe>
              <p style="text-align:center;font-family:sans-serif;padding:10px;position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:white;margin:0;">
                <a href="${url}" download="${book.name}.pdf" style="color:white;">📥 دانلود فایل</a>
              </p>
            </body></html>
          `);
          win.document.close();
          showToast('🌐 در حال باز کردن در مرورگر...');
        } else {
          const link = document.createElement('a');
          link.href = url;
          link.download = `${book.name}.pdf`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('📥 فایل دانلود شد!');
        }
        break;

      case 'reader':
      case 'download':
        const link = document.createElement('a');
        link.href = url;
        link.download = `${book.name}.pdf`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('📥 فایل دانلود شد!');
        break;

      case 'share':
        if (navigator.share && navigator.canShare) {
          const file = new File([blob], `${book.name}.pdf`, { type: 'application/pdf' });
          navigator.share({
            title: book.name,
            files: [file]
          }).then(() => {
            showToast('📤 اشتراک‌گذاری انجام شد!');
          }).catch((err) => {
            if (err.name !== 'AbortError') {
              showToast('⚠️ اشتراک‌گذاری لغو شد.');
            }
          });
        } else {
          const link2 = document.createElement('a');
          link2.href = url;
          link2.download = `${book.name}.pdf`;
          document.body.appendChild(link2);
          link2.click();
          document.body.removeChild(link2);
          showToast('📥 فایل دانلود شد!');
        }
        break;
    }
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch(e) {
    alert('خطا در باز کردن فایل: ' + e.message);
  }
}

// ====== Remove, Edit ======
async function removeBook(bookId) {
  if (!confirm('Are you sure you want to remove this book?')) return;
  await deleteBook(bookId);
  books = books.filter(b => b.id !== bookId);
  delete currentPage[bookId];
  localStorage.setItem('cozyshelf_pages', JSON.stringify(currentPage));
  renderBooks();
  showToast('🗑️ Book removed');
}

function toggleEdit(bookId) {
  const editDiv = document.getElementById(`edit_${bookId}`);
  if (editDiv.style.display === 'flex') {
    editDiv.style.display = 'none';
  } else {
    editDiv.style.display = 'flex';
    const input = document.getElementById(`edit_input_${bookId}`);
    input.focus();
    input.select();
  }
}

async function saveEditName(bookId) {
  const input = document.getElementById(`edit_input_${bookId}`);
  const newName = input.value.trim();
  if (newName === '') { alert('Name cannot be empty!'); return; }
  const book = books.find(b => b.id === bookId);
  if (book) {
    book.name = newName;
    await saveBook(book);
    renderBooks();
    showToast('✏️ Name updated!');
  }
}

// ====== Upload PDF (اصلاح شده با console.log برای دیباگ) ======
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const coverInput = document.getElementById('coverInput');

  if (!fileInput) console.error('❌ fileInput پیدا نشد!');
  if (!uploadBtn) console.error('❌ uploadBtn پیدا نشد!');
  if (!coverInput) console.error('❌ coverInput پیدا نشد!');

  uploadBtn?.addEventListener('click', function(e) {
    console.log('📁 دکمه آپلود کلیک شد!');
    const input = document.getElementById('fileInput');
    if (input) {
      input.click();
    } else {
      alert('خطا: ورودی فایل پیدا نشد!');
    }
  });

  fileInput?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    console.log('📄 فایل انتخاب شد:', file?.name);
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      alert('⚠️ File is too large! Maximum size is 10MB.');
      this.value = '';
      return;
    }

    if (file.type === 'application/pdf') {
      const reader = new FileReader();
      reader.onload = async function(event) {
        try {
          const newBook = {
            id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4),
            name: file.name.replace('.pdf', '').replace(/\.[^.]+$/, ''),
            totalPages: Math.floor(Math.random() * 300) + 100,
            fileData: event.target.result,
            coverData: null
          };
          books.push(newBook);
          currentPage[newBook.id] = 0;
          await saveBook(newBook);
          localStorage.setItem('cozyshelf_pages', JSON.stringify(currentPage));
          renderBooks();
          showToast('✅ Book uploaded! Tap Read to view.');
        } catch(err) {
          alert('Error: ' + err.message);
        }
      };
      reader.onerror = function() {
        alert('Error reading file. Please try again.');
      };
      reader.readAsDataURL(file);
      this.value = '';
    } else {
      alert('❌ Please select a PDF file only!');
      this.value = '';
    }
  });

  coverInput?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('❌ لطفاً یک عکس انتخاب کن!');
      this.value = '';
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      alert('⚠️ حجم عکس نباید بیشتر از ۲ مگابایت باشه.');
      this.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = async function(event) {
      const book = books.find(b => b.id === coverInputTarget);
      if (book) {
        book.coverData = event.target.result;
        await saveBook(book);
        renderBooks();
        showToast('🖼️ جلد کتاب تغییر کرد!');
      }
      coverInputTarget = null;
    };
    reader.readAsDataURL(file);
    this.value = '';
  });
});

// ====== Modal events ======
document.querySelectorAll('.app-option').forEach(btn => {
  btn.addEventListener('click', function() {
    handleAppSelection(this.dataset.app);
  });
});

document.getElementById('closeSelectorBtn').addEventListener('click', function() {
  document.getElementById('appSelectorModal').classList.remove('active');
  document.body.style.overflow = 'auto';
  pendingBookId = null;
});

document.getElementById('appSelectorModal').addEventListener('click', function(e) {
  if (e.target === this) {
    document.getElementById('closeSelectorBtn').click();
  }
});

// ====== Init ======
async function init() {
  try {
    await openDB();
    const pages = localStorage.getItem('cozyshelf_pages');
    if (pages) currentPage = JSON.parse(pages);
    books = await getAllBooks();
    renderBooks();
  } catch(e) {
    console.error('Init error:', e);
    document.getElementById('booksList').innerHTML = '<p class="empty">⚠️ خطا در بارگذاری دیتابیس</p>';
  }
}

init();
</script>
</body>
</html>
